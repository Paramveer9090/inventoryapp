// android/settings.gradle

pluginManagement {
  // 1. Read flutter.sdk from local.properties
  def props = new Properties()
  file("local.properties").withReader("UTF-8") { props.load(it) }
  def flutterSdkPath = props.getProperty("flutter.sdk")
  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"

  // 2. Include Flutter's Gradle tooling
  includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

  // 3. Standard repos
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}

// 4. Declare your plugins here — none of these belongs inside pluginManagement
plugins {
  // Flutter’s loader plugin (no apply false)
  id "dev.flutter.flutter-plugin-loader"    version "1.0.0"
  id "com.android.application"              version "8.2.1" apply false
  id "org.jetbrains.kotlin.android"         version "1.8.21" apply false
}

include(":app")


